<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Quiz Solver</title></head><body>
<header><h1>Quiz Solver</h1><p id="status" role="status">Checking connection…</p></header>
<main>
<label><input id="enabled" type="checkbox"> Enabled</label>
<label><input id="clickMode" type="checkbox"> Click to Solve</label>
<label><input id="hoverMode" type="checkbox"> Ctrl + Hover</label>
<label><input id="explanations" type="checkbox"> Show explanations</label>
<label><input id="highlights" type="checkbox"> Highlight suggestions</label>
<label><input id="authorizedPractice" type="checkbox"> I am using an authorized practice quiz</label>
<label><input id="autoSelect" type="checkbox"> Auto-select suggested answers</label>
<label><input id="autoSite" type="checkbox"> Auto-solve this site when pages open</label>
<div class="actions"><button id="solveAll">Solve All</button><button id="clear">Clear</button><button id="settings">Settings</button></div>
<p id="message" role="status"></p>
</main><script src="popup.js"></script></body></html>
