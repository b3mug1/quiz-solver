<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="options.css"><title>Quiz Solver Settings</title></head><body><main>
<h1>Quiz Solver Settings</h1><p>Use a backend you control. Keep the Gemini key on the server.</p>
<label>Backend URL<input id="backendUrl" type="url" placeholder="http://127.0.0.1:8000"></label>
<label>Personal API token<input id="apiToken" type="password" autocomplete="off"></label>
<label class="inline"><input id="imageConsent" type="checkbox"> Allow question images to be sent to the backend when readable</label>
<button id="save">Save and test</button><p id="message" role="status"></p>
</main><script src="options.js"></script></body></html>
